server {
    listen 80;
    server_name localhost;

    # The hero videos keep stable file names. Versioned query strings in the
    # app allow a future replacement while repeat visits use the local copy.
    location ~* ^/videos/.*\.(?:mp4|webm)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Vite fingerprints compiled assets, so they can be cached permanently.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }
    
    # Frontend - Static files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
    
    location /api {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://eman-website-main-backend:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeout for large uploads
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # Increase body size for image uploads
        client_max_body_size 50M;
    }
    
    # Error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
